name: iponlock
description: "PesoFlow — secure savings, wallets, goals, and debt tracker."
publish_to: 'none'
version: 1.7.1+9

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  local_auth: ^2.3.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_slidable: ^3.1.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5
  image_picker: ^1.1.0
  image: ^4.3.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
